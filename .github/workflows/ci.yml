name: CI

on:
  pull_request: ~
  push:
    branches: [main, dev]
  workflow_dispatch: ~

permissions:
  contents: read
  actions: read

jobs:

  linux:
    name: Linux
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      task: |
        perl -V
        #~ Install cpanm with its canonical self-bootstrap: pipe the fatpacked
        #~ installer to perl with App::cpanminus as the argument, which installs
        #~ the real `cpanm` binary into the active perl's bin dir (already on
        #~ PATH). FreeBSD's prepare installs curl so this works in the VMs too.
        #~ `command -v cpanm` is a hard fail point that catches any no-op.
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        cpanm -v .
      matrix: >
        [
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.40.5"},
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.3","configure":"-Duselongdouble","variant":"longdoubles"}
        ]

  macos:
    name: macOS
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      task: |
        perl -V
        #~ Install cpanm with its canonical self-bootstrap: pipe the fatpacked
        #~ installer to perl with App::cpanminus as the argument, which installs
        #~ the real `cpanm` binary into the active perl's bin dir (already on
        #~ PATH). FreeBSD's prepare installs curl so this works in the VMs too.
        #~ `command -v cpanm` is a hard fail point that catches any no-op.
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        cpanm -v .
      matrix: >
        [
          {"platform_name":"macos","os":"macos-15","arch":"aarch64","toolchain":"gcc","perl_version":"5.42.3"}
        ]

  windows:
    name: Windows
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      task: |
        perl -V
        #~ Install cpanm with its canonical self-bootstrap: pipe the fatpacked
        #~ installer to perl with App::cpanminus as the argument, which installs
        #~ the real `cpanm` binary into the active perl's bin dir (already on
        #~ PATH). FreeBSD's prepare installs curl so this works in the VMs too.
        #~ `command -v cpanm` is a hard fail point that catches any no-op.
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        cpanm -v .
      matrix: >
        [
          {"platform_name":"windows","os":"windows-latest","arch":"x86_64","toolchain":"gcc","prepare":"choco install strawberryperl"}
        ]

  freebsd:
    name: FreeBSD
    uses: sanko/workflow-testing/.github/workflows/run-vm.yml@main
    secrets: inherit
    with:
      os_version: '15.0'
      task: |
        perl -V
        #~ The vmactions FreeBSD VM runs as root, and xmake refuses to run as
        #~ root ("Running xmake as root is extremely dangerous and no longer
        #~ supported") so the Alien::Xmake tests fail. XMAKE_ROOT=y is xmake's
        #~ documented opt-in for exactly this case; harmless on non-root hosts.
        export XMAKE_ROOT=y
        #~ Install cpanm with its canonical self-bootstrap: pipe the fatpacked
        #~ installer to perl with App::cpanminus as the argument, which installs
        #~ the real `cpanm` binary into the active perl's bin dir (already on
        #~ PATH). FreeBSD's prepare installs curl so this works in the VMs too.
        #~ `command -v cpanm` is a hard fail point that catches any no-op.
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        cpanm -v .
      matrix: >
        [
          {"platform_name":"freebsd","os":"freebsd","arch":"x86_64","toolchain":"clang","prepare":"pkg install -y gmake curl git bash","perl_version":"5.40.5"}
        ]

  results:
    name: Summary
    if: always()
    needs: [linux, macos, windows, freebsd]
    uses: sanko/workflow-testing/.github/workflows/results-summary.yml@main
