name: CI

on:
  pull_request: ~
  push:
    branches: [main, dev]
  workflow_dispatch: ~

permissions:
  contents: read
  actions: read

jobs:

  linux:
    name: Linux
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      task: |
        perl -V
        #~ Install cpanm via its canonical self-bootstrap (installs the real
        #~ `cpanm` binary into the active perl's bin dir). `command -v cpanm`
        #~ is a hard fail point that catches any no-op.
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        cpanm -v .
      matrix: >
        [
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.40.5"},
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.3","configure":"-Duselongdouble","variant":"longdoubles"},
          {"platform_name":"ubuntu-arm","os":"ubuntu-24.04-arm","arch":"aarch64","toolchain":"gcc","perl_version":"5.40.5"},
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"clang","perl_version":"5.40.5"},
          {"platform_name":"ubuntu-arm","os":"ubuntu-24.04-arm","arch":"aarch64","toolchain":"clang","perl_version":"5.40.5"}
        ]

  macos:
    name: macOS
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      task: |
        perl -V
        #~ Install cpanm via its canonical self-bootstrap (installs the real
        #~ `cpanm` binary into the active perl's bin dir). `command -v cpanm`
        #~ is a hard fail point that catches any no-op.
        curl -L https://cpanmin.us | perl - App::cpanminus
        command -v cpanm
        cpanm -v .
      matrix: >
        [
          {"platform_name":"macos","os":"macos-15","arch":"aarch64","toolchain":"gcc","perl_version":"5.42.3"},
          {"platform_name":"macos-intel","os":"macos-15-intel","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.3"},
          {"platform_name":"macos","os":"macos-15","arch":"aarch64","toolchain":"clang","perl_version":"5.42.3"},
          {"platform_name":"macos-intel","os":"macos-15-intel","arch":"x86_64","toolchain":"clang","perl_version":"5.42.3"}
        ]

  windows:
    name: Windows
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      task: |
        perl -V
        perl -e 'if ($^O eq "MSWin32") { print "===PATH DUMP (MSWin32)===\n$ENV{PATH}\n===END===\n"; print "===TMPDUMP===\nTMP=$ENV{TMP}\nTEMP=$ENV{TEMP}\nTMPDIR=$ENV{TMPDIR}\nWindows_TEMP=$ENV{Windows_TEMP}\n===END===\n" }'
        # dump xmake's resolved tmpdir + full create-working error to a file
        perl -e 'if ($^O eq "MSWin32") {
            my $x = "D:/a/Alien-Xmake/Alien-Xmake/blib/lib/auto/share/dist/Alien-Xmake/xmake.exe";
            my $out = `"$x" lua private.xrepo install -y -k shared zlib 2>&1`;
            print "===XREPO-RAW-START===\n$out\n===XREPO-RAW-END===\nrc=" . ($? >> 8) . "\n";
        }'
        # TEST FIX: point TMP/TEMP at a real long-style path (short 8.3 name
        # RUNNER~1 may be unresolvable if 8dot3name generation is disabled),
        # then retry the xrepo install to confirm the crash is a bad temp dir.
        perl -e 'if ($^O eq "MSWin32") {
            my $long = "C:\\Users\\runneradmin\\AppData\\Local\\Temp";
            $ENV{TMP} = $ENV{TEMP} = $ENV{TMPDIR} = $long;
            print "===FIXED-TMP=$long===\n";
            my $x = "D:/a/Alien-Xmake/Alien-Xmake/blib/lib/auto/share/dist/Alien-Xmake/xmake.exe";
            my $out = `"$x" lua private.xrepo install -y -k shared zlib 2>&1`;
            print "===FIXED-XREPO-START===\n$out\n===FIXED-XREPO-END===\nrc=" . ($? >> 8) . "\n";
        }'
        # TEST FIX 2: HOME/USERPROFILE hypothesis. xrepo (unlike t/01's plain
        # xmake) shells out to git to maintain its package repos; git resolves
        # its global config under HOME/USERPROFILE. Under the runner's git-bash
        # shell HOME can be a broken/UNIX path. Dump them, then retry with a
        # valid Windows HOME/USERPROFILE.
        perl -e 'if ($^O eq "MSWin32") {
            my $x = "D:/a/Alien-Xmake/Alien-Xmake/blib/lib/auto/share/dist/Alien-Xmake/xmake.exe";
            print "===ENVDUMP HOME=$ENV{HOME} USERPROFILE=$ENV{USERPROFILE} HOMEDRIVE=$ENV{HOMEDRIVE} HOMEPATH=$ENV{HOMEPATH}\n";
            $ENV{HOME} = "C:\\Users\\runneradmin";
            $ENV{USERPROFILE} = "C:\\Users\\runneradmin";
            my $out = `"$x" lua private.xrepo install -y -k shared zlib 2>&1`;
            print "===FIX2-XREPO-START===\n$out\n===FIX2-XREPO-END===\nrc=" . ($? >> 8) . "\n";
        }'
        perl -V
        #~ Install cpanm via its canonical self-bootstrap (installs the real
        #~ `cpanm` binary into the active perl's bin dir). `command -v cpanm`
        #~ is a hard fail point that catches any no-op.
        curl -L https://cpanmin.us | perl - App::cpanminus
        cpanm -v .
      matrix: >
        [
          {"platform_name":"windows","os":"windows-latest","arch":"x86_64","toolchain":"msvc","prepare":"choco install strawberryperl"}
        ]

  results:
    name: Summary
    if: always()
    needs: [linux, macos, windows]
    uses: sanko/workflow-testing/.github/workflows/results-summary.yml@main
