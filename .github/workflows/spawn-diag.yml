name: Spawn Diagnostic

on:
  workflow_dispatch: ~
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  probe:
    name: Windows-spawn-probe
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: cmd,    toolchain: gcc }
          - { target: cmd,    toolchain: clang }
          - { target: xmake,  toolchain: gcc }
          - { target: xmake,  toolchain: clang }
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.0

      - name: Prepare environment
        shell: bash
        run: choco install strawberryperl

      - name: Force Strawberry Perl on PATH (Windows)
        shell: pwsh
        run: |
          $sb = 'C:\Strawberry'
          foreach ($d in @("$sb\perl\site\bin", "$sb\perl\bin", "$sb\c\bin")) {
            Add-Content -Path $env:GITHUB_PATH -Value $d
          }

      - name: List relevant env
        shell: bash
        run: |
          echo "perl -> $(perl -e 'print qq($^X :: $^O)')"
          echo "COMSPEC=$COMSPEC"
          echo "MSYSTEM=$MSYSTEM"
          echo "USERPROFILE=$USERPROFILE"
          cpanm --version || true

      #~ If the target needs xmake, build it through the Alien installer so the
      #~ harness has an existing xmake to spawn. cmd path skips this.
      - name: Build Alien::Xmake (xmake target only)
        if: matrix.target == 'xmake'
        shell: bash
        run: |
          export PATH="/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
          cpanm --notest --installdeps . || true
          perl Build.PL
          perl Build
          perl Build test 2>&1 | tail -5 || true

      - name: Run spawn harness
        shell: bash
        run: |
          export PATH="/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
          SPAWN_TARGET=${{ matrix.target }} perl t/spawn_harness.pl 2>&1

      - name: Upload harness log on failure
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: spawn-harness-${{ matrix.target }}-${{ matrix.toolchain }}
          path: t/spawn-harness-*.log
          retention-days: 7
